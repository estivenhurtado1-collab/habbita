services:
  - type: web
    name: habitta-ia
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PROPINTEL_DB
        value: /tmp/propintel.db
      - key: LOW_MEMORY
        value: "1"
      - key: SEARCH_SEQUENTIAL
        value: "1"
      - key: SEARCH_PORTAL_TIMEOUT
        value: "40"
      - key: PORT
        value: "8000"
